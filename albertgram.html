<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Albertgram</title>
<style>
:root {
  color-scheme: dark;
  --bg: #12101c;
  --panel: #191626;
  --raised: #221d32;
  --line: #352e48;
  --text: #f6f2ff;
  --muted: #b0a7c3;
  --accent: #c1adff;
  --accent-ink: #241447;
  --error: #ffb0bf;
  font: 16px system-ui, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; min-width: 280px; background: var(--bg); color: var(--text); }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .6; }
button, input, textarea, a { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
a { color: var(--accent); }
h1, h2, p { margin: 0; }
h1 { font-size: 1.9rem; letter-spacing: -.055em; }
h2 { font-size: 1.25rem; letter-spacing: -.025em; }
small, .muted { color: var(--muted); }
.brand { display: flex; align-items: center; gap: 12px; font-weight: 750; letter-spacing: -.03em; }
.mark {
  display: grid; place-items: center; flex: none; width: 42px; height: 42px;
  border-radius: 15px; color: var(--accent-ink);
  background: linear-gradient(145deg, #ebd8ff, #a891fc);
  font-weight: 900; font-size: 1.35rem;
}
#auth {
  min-height: 100svh; padding: 24px 16px; display: grid; place-items: center;
  background: radial-gradient(ellipse at 50% 5%, #312149, transparent 65%);
}
.card {
  width: min(100%, 420px); background: var(--panel); border: 1px solid var(--line);
  border-radius: 26px; padding: clamp(18px, 5vw, 28px); box-shadow: 0 24px 70px #09071266;
}
.card .brand { margin-bottom: 8px; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin: 22px 0 16px; padding: 4px; background: var(--bg); border-radius: 14px; }
.tabs button, .icon, .quiet, .primary, .secondary {
  border: 0; border-radius: 11px; min-height: 42px; padding: 8px 12px;
}
.tabs button, .icon, .quiet { background: transparent; color: var(--muted); }
.tabs [aria-pressed="true"], .icon:hover, .quiet:hover { background: var(--raised); color: var(--text); }
.primary { background: var(--accent); color: var(--accent-ink); font-weight: 750; }
.secondary { background: var(--raised); color: var(--text); }
.danger { color: var(--error); }
.wide { width: 100%; }
form.stack, .stack { display: grid; gap: 12px; }
label { display: grid; gap: 5px; color: var(--muted); font-size: .875rem; }
input, textarea {
  width: 100%; min-width: 0; border: 1px solid var(--line); border-radius: 11px;
  background: var(--bg); padding: 10px 12px; font-size: 1rem;
}
input::placeholder, textarea::placeholder { color: var(--muted); opacity: 1; }
.error { color: var(--error); font-size: .875rem; overflow-wrap: anywhere; }
.error:empty { display: none; }
#auth-error { margin-top: 12px; }
#setup { margin-top: 18px; }
#secret { user-select: all; overflow-wrap: anywhere; background: var(--bg); padding: 12px; border-radius: 11px; }
#app { display: grid; grid-template-columns: minmax(260px, 335px) minmax(0, 1fr); height: 100dvh; }
.sidebar, .conversation { min-height: 0; min-width: 0; display: flex; flex-direction: column; }
.sidebar { background: var(--panel); border-right: 1px solid var(--line); }
.toolbar { display: flex; align-items: center; gap: 6px; min-height: 68px; padding: max(10px, env(safe-area-inset-top)) 12px 10px; }
.toolbar .brand { margin-right: auto; min-width: 0; }
.icon { flex: none; padding: 0; width: 42px; font-size: 1.15rem; }
#search { width: auto; margin: 2px 12px 12px; }
#list { flex: 1; overflow: auto; padding: 0 8px; }
.list-status { padding: 16px 10px; color: var(--muted); }
.chat-row {
  display: flex; align-items: center; gap: 11px; width: 100%; padding: 9px 8px;
  border: 1px solid transparent; border-radius: 13px; text-align: left; background: transparent;
}
.chat-row:hover, .chat-row[aria-current="true"] { background: var(--raised); }
.chat-row[aria-current="true"] { border-color: var(--line); }
.chat-row .details, .chat-header .details { flex: 1; min-width: 0; }
.details > * { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.avatar {
  flex: none; display: grid; place-items: center; width: 43px; height: 43px; border-radius: 15px;
  color: #fff; font-weight: 760; background: linear-gradient(145deg, hsl(var(--hue, 262) 52% 43%), hsl(var(--hue, 262) 52% 32%));
}
.verified { color: var(--accent); padding-left: 4px; font-size: .85em; }
.sidebar-footer { padding: 12px 16px max(12px, env(safe-area-inset-bottom)); border-top: 1px solid var(--line); overflow-wrap: anywhere; }
.chat-header { background: var(--panel); border-bottom: 1px solid var(--line); }
#back { display: none; }
#placeholder { margin: auto; max-width: 380px; text-align: center; padding: 24px; }
#placeholder .mark { margin: 0 auto 16px; }
#placeholder p { margin-top: 8px; }
.connection { padding: 8px 16px; background: var(--raised); color: var(--accent); font-size: .875rem; }
#messages { flex: 1; overflow: auto; padding: 18px clamp(10px, 4vw, 48px); }
#message-content { display: flex; flex-direction: column; gap: 8px; min-height: 100%; }
#message-content:has(.bubble)::before { content: ""; margin-top: auto; }
.message-empty { margin: auto; text-align: center; color: var(--muted); }
.bubble {
  align-self: flex-start; max-width: min(85%, 640px); min-width: 0; border: 1px solid var(--line);
  background: var(--panel); border-radius: 17px 17px 17px 5px; padding: 8px 11px;
}
.bubble.mine { align-self: flex-end; border-radius: 17px 17px 5px 17px; background: #33264b; border-color: #4b386a; }
.bubble p { white-space: pre-wrap; overflow-wrap: anywhere; }
.author { display: block; color: var(--accent); margin-bottom: 4px; overflow-wrap: anywhere; }
.message-meta { display: flex; justify-content: flex-end; gap: 4px; align-items: center; margin-top: 3px; }
time { color: var(--muted); font-size: .75rem; }
.message-menu { min-width: 30px; min-height: 28px; padding: 0 4px; border-radius: 7px; background: transparent; border: 0; color: var(--accent); }
.keyboard { display: grid; gap: 4px; margin-top: 5px; }
.keyboard-row { display: flex; gap: 4px; flex-wrap: wrap; }
.keyboard-row button { flex: 1; overflow-wrap: anywhere; color: var(--accent); }
.composer-area { background: var(--panel); border-top: 1px solid var(--line); padding: 10px 12px max(10px, env(safe-area-inset-bottom)); }
#composer { display: flex; gap: 8px; max-width: 920px; margin: auto; align-items: flex-end; }
#composer textarea { resize: none; field-sizing: content; min-height: 44px; max-height: 140px; }
#composer button { flex: none; min-height: 44px; }
#chat-error { max-width: 920px; margin: 0 auto 8px; }
dialog { color: var(--text); max-height: 85dvh; overflow: auto; }
@media (min-width: 721px) { #sidebar-connection { display: none; } }
dialog::backdrop { background: #090712bd; }
.dialog-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.admin-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; border-top: 1px solid var(--line); padding: 8px 0; }
.admin-row > span { flex: 1 0 140px; overflow-wrap: anywhere; }
.admin-row button { min-height: 36px; font-size: .875rem; }
@media (max-width: 720px) {
  #app { grid-template-columns: minmax(0, 1fr); }
  .sidebar { border-right: 0; }
  #app:not(.chat-open) .conversation, #app.chat-open .sidebar { display: none; }
  #back { display: block; }
  .bubble { max-width: 91%; }
  .toolbar .mark { width: 34px; height: 34px; border-radius: 11px; }
}
:root {
  --movement: cubic-bezier(.2, .65, .3, 1);
  --speed: 200ms;
  --wash: #312149;
  --ambient: transparent;
  --bubble-mine: #33264b;
  --bubble-edge: #4b386a;
  --mark-light: #ebd8ff;
  --mark-dark: #a891fc;
  --card-shadow: 0 24px 70px #09071266;
  --avatar-saturation: 52%;
}
:root[data-theme="neon"] {
  --bg: #090c15;
  --panel: #111527;
  --raised: #1d2038;
  --line: #383451;
  --text: #fff1fc;
  --muted: #c2b6d8;
  --accent: #66ffe0;
  --accent-ink: #062826;
  --wash: #452047;
  --ambient: #143949;
  --bubble-mine: #232641;
  --bubble-edge: #8255a0;
  --mark-light: #84ffe8;
  --mark-dark: #75b6ff;
  --card-shadow: 0 0 35px #8975fa22, 0 24px 70px #03030a88;
  --avatar-saturation: 67%;
}
:root[data-theme="tv"] {
  --bg: #0c1019;
  --panel: #171e2c;
  --raised: #243247;
  --line: #3a4960;
  --text: #f5f8ff;
  --muted: #b8c5da;
  --accent: #dfedff;
  --accent-ink: #101b2d;
  --wash: #253f63;
  --ambient: #1b284a;
  --bubble-mine: #263a54;
  --bubble-edge: #4b6282;
  --mark-light: #f5faff;
  --mark-dark: #adc9ee;
  --card-shadow: 0 22px 58px #02061099, inset 0 1px #ffffff14;
  --avatar-saturation: 36%;
}
body, .sidebar, .card, .chat-header, .composer-area, .bubble, input, textarea, button {
  transition: background-color var(--speed) var(--movement), color var(--speed) var(--movement),
    border-color var(--speed) var(--movement), box-shadow var(--speed) var(--movement), transform var(--speed) var(--movement);
}
#auth { background: radial-gradient(ellipse at 50% 0%, var(--wash), transparent 72%); }
.conversation { background: radial-gradient(ellipse at 65% 4%, var(--ambient), transparent 65%); }
.mark { background: linear-gradient(145deg, var(--mark-light), var(--mark-dark)); }
.card { box-shadow: var(--card-shadow); }
.bubble.mine { background: var(--bubble-mine); border-color: var(--bubble-edge); }
.avatar { background: linear-gradient(145deg, hsl(var(--hue, 262) var(--avatar-saturation) 43%), hsl(var(--hue, 262) var(--avatar-saturation) 32%)); }
:root[data-theme="tv"] .chat-row, :root[data-theme="tv"] .bubble { border-radius: 18px; }
:root[data-theme="tv"] .chat-row:hover, :root[data-theme="tv"] .chat-row[aria-current="true"] {
  background: linear-gradient(135deg, #344560, var(--raised));
  box-shadow: 0 6px 14px #02071345, inset 0 1px #ffffff1a;
}
:root[data-theme="neon"] .mark, :root[data-theme="neon"] .primary:hover { box-shadow: 0 0 19px #66ffe04a; }
:root[data-theme="neon"] .chat-row[aria-current="true"] { border-color: #8874c5; }
button:active:not(:disabled) { transform: scale(.97); }
#auth:not([hidden]) .card, #app:not([hidden]), .bubble.arriving { animation: appear 230ms var(--movement) both; }
@keyframes appear {
  from { opacity: 0; transform: translateY(7px); }
  to { opacity: 1; transform: translateY(0); }
}
dialog[open] { animation: dialog-enter 220ms var(--movement) both; }
dialog[open]::backdrop { animation: backdrop-enter 190ms ease-out both; }
@keyframes dialog-enter {
  from { opacity: 0; transform: translateY(10px) scale(.985); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes backdrop-enter { from { opacity: 0; } to { opacity: 1; } }
.theme-options { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.theme-option {
  display: grid; justify-items: stretch; gap: 7px; padding: 6px; background: var(--bg);
  border: 1px solid var(--line); border-radius: 13px; text-align: center; font-size: .78rem;
}
.theme-option[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.theme-swatch { height: 42px; border-radius: 8px; border: 1px solid #ffffff21; background: #29203c; }
.theme-swatch[data-preview="classic"] { background: linear-gradient(130deg, #282038 45%, #ab8ef4); }
.theme-swatch[data-preview="neon"] { background: linear-gradient(130deg, #0f152b 28%, #8e54e8 66%, #66ffe0); }
.theme-swatch[data-preview="tv"] { background: linear-gradient(130deg, #151e2d 26%, #475f82 68%, #dfeeff); }
#settings-login { margin-top: 8px; font-size: .875rem; }
.motion-switch {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  border: 1px solid var(--line); border-radius: 13px; padding: 9px 11px;
  text-align: left; background: var(--bg);
}
.switch-track {
  display: block; position: relative; flex: 0 0 42px; height: 24px; border-radius: 999px;
  background: var(--raised); border: 1px solid var(--line);
  transition: background-color var(--speed) var(--movement);
}
.switch-track::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px;
  border-radius: 50%; background: var(--muted); transition: transform var(--speed) var(--movement);
}
.motion-switch[aria-checked="true"] .switch-track { background: var(--accent); }
.motion-switch[aria-checked="true"] .switch-track::after { transform: translateX(18px); background: var(--accent-ink); }
.bot-token { background: var(--bg); padding: 12px; border-radius: 10px; overflow-wrap: anywhere; user-select: all; }
:root[data-motion="off"] *, :root[data-motion="off"] *::before, :root[data-motion="off"] *::after {
  animation: none !important; transition: none !important;
}
@media (max-width: 720px) {
  #app.chat-open .chat-header, #app.chat-open #messages, #app.chat-open .composer-area,
  #app:not(.chat-open) .sidebar { animation: mobile-enter 220ms var(--movement) both; }
  @keyframes mobile-enter { from { opacity: .4; transform: translateX(8px); } to { opacity: 1; transform: translateX(0); } }
  .sidebar .toolbar .icon { width: 38px; }
}
@media (max-width: 360px) {
  .sidebar .toolbar .mark { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0s !important; transition-duration: 0s !important; }
}
</style>
</head>
<body>
<main id="auth">
  <section class="card" aria-labelledby="auth-title">
    <div class="brand"><span class="mark" aria-hidden="true">A</span><h1 id="auth-title">Albertgram</h1></div>
    <p class="muted">Мессенджер с ботами</p>
    <div class="tabs" id="auth-tabs" role="group" aria-label="Управление аккаунтом">
      <button id="login-tab" type="button" aria-pressed="true">Вход</button>
      <button id="register-tab" type="button" aria-pressed="false">Регистрация</button>
    </div>
    <form id="auth-form" class="stack">
      <label>Юзернейм<input id="username" placeholder="@albert" autocomplete="username" autocapitalize="none" required></label>
      <label id="display-name-field" hidden>Имя<input id="display-name" autocomplete="nickname"></label>
      <label>Пароль<input id="password" type="password" autocomplete="current-password" required></label>
      <label id="login-code-field">Код из приложения<input id="login-code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required></label>
      <label id="invite-field" hidden>Ключ админа<input id="invite" type="password" autocomplete="off"></label>
      <button class="primary" id="auth-submit">Войти</button>
    </form>
    <form id="setup" class="stack" hidden>
      <p>Добавь аккаунт в приложение-аутентификатор вручную с этим ключом.</p>
      <code id="secret"></code>
      <button class="secondary" id="copy-key" type="button">Скопировать ключ</button>
      <a id="auth-link" hidden>Открыть в аутентификаторе</a>
      <label>Шестизначный код<input id="confirm-code" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" autocomplete="one-time-code" required></label>
      <button class="primary" id="confirm-submit">Подтвердить</button>
      <button class="quiet" id="cancel-setup" type="button">Вернуться ко входу</button>
    </form>
    <p id="auth-error" class="error" role="alert"></p>
    <button class="quiet wide" id="settings-login" type="button">⚙ Настройки</button>
  </section>
</main>

<div id="app" hidden>
  <aside class="sidebar" aria-label="Чаты">
    <div class="toolbar">
      <div class="brand"><span class="mark" aria-hidden="true">A</span> Albertgram</div>
      <button class="icon" id="admin" type="button" aria-label="Админ-меню" title="Админ-меню" hidden>◆</button>
      <button class="icon" id="settings" type="button" aria-label="Настройки" title="Настройки">⚙</button>
      <button class="icon" id="group" type="button" aria-label="Создать группу" title="Создать группу">＋</button>
      <button class="icon" id="logout" type="button" aria-label="Выйти" title="Выйти">⎋</button>
    </div>
    <input id="search" type="search" placeholder="Поиск по @юзернейму" aria-label="Поиск по юзернейму" autocomplete="off" autocapitalize="none">
    <p id="sidebar-connection" class="connection" role="status" hidden></p>
    <nav id="list" aria-label="Список чатов"></nav>
    <div class="sidebar-footer"><small id="profile"></small></div>
  </aside>

  <main class="conversation" aria-label="Переписка">
    <div class="toolbar chat-header" id="chat-header" hidden>
      <button class="icon" id="back" type="button" aria-label="Назад к чатам">←</button>
      <div class="avatar" id="chat-avatar" aria-hidden="true"></div>
      <div class="details"><strong id="chat-title"></strong><small id="chat-type"></small></div>
    </div>
    <p id="connection" class="connection" role="status" hidden></p>
    <section id="placeholder">
      <span class="mark" aria-hidden="true">A</span>
      <h2>Выбери чат</h2>
      <p class="muted">Чтобы создать бота, найди @Papochka и напиши ему.</p>
    </section>
    <div id="messages" aria-label="История сообщений" tabindex="0" hidden><div id="message-content"></div></div>
    <div class="composer-area" id="composer-area" hidden>
      <p class="error" id="chat-error" role="alert"></p>
      <form id="composer">
        <textarea id="message" rows="1" placeholder="Сообщение" aria-label="Сообщение" required></textarea>
        <button class="primary" id="send" type="submit">Отправить</button>
      </form>
    </div>
  </main>
</div>

<dialog class="card" id="dialog" aria-labelledby="dialog-title">
  <div class="dialog-head">
    <h2 id="dialog-title"></h2>
    <button class="icon" id="close-dialog" type="button" aria-label="Закрыть">×</button>
  </div>
  <div id="dialog-body" class="stack"></div>
</dialog>

<script>
'use strict';

const $ = (id) => document.getElementById(id);

function element(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text != null) node.textContent = text;
  return node;
}

const THEMES = {
  classic: 'Классика',
  neon: 'Неон',
  tv: 'Apple TV'
};
const storedTheme = localStorage.getItem('ag_theme');
setTheme(Object.hasOwn(THEMES, storedTheme) ? storedTheme : 'classic');

const motionPreference = matchMedia('(prefers-reduced-motion: reduce)');
let animationsEnabled = localStorage.getItem('ag_motion') !== 'off';
setMotion(animationsEnabled);
const tokenServer = location.origin;
const previousTokenServer = localStorage.getItem('ag_server');
const previousApi = localStorage.getItem('ag_srv');
let token = previousTokenServer === tokenServer || (previousTokenServer === null && !previousApi)
  ? localStorage.getItem('ag')
  : null;
localStorage.removeItem('ag_srv');
if (!token) {
  localStorage.removeItem('ag');
  localStorage.removeItem('ag_server');
}
let me = null;
let registration = false;
let pendingUsername = '';
let enrollmentTicket = '';
let chats = [];
let currentChat = null;
let chatsRequest = 0;
let appliedChatsRequest = 0;
let messageRequest = 0;
let searchRequest = 0;
let searchTimer;
let searchController;
let messagesSnapshot = '';
let latestMessageId = null;
let version = 0;
const drafts = new Map();
const sending = new Set();
const timeFormat = new Intl.DateTimeFormat('ru-RU', {hour: '2-digit', minute: '2-digit'});
const cleanUsername = (text) => text.trim().replace(/^@/, '');
const keyFor = (id) => String(id);
const sameId = (left, right) => keyFor(left) === keyFor(right);
const findChat = (id) => chats.find((chat) => sameId(chat.id, id));
const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

class ApiError extends Error {
  constructor(message, status) {
    super(message);
    this.status = status;
  }
}

async function api(path, {body, signal, auth = true} = {}) {
  const headers = new Headers();
  if (token && auth) headers.set('Authorization', 'Bearer ' + token);
  if (body !== undefined) headers.set('Content-Type', 'application/json');

  let response;
  try {
    response = await fetch(path, {
      method: body === undefined ? 'GET' : 'POST',
      headers,
      body: body === undefined ? undefined : JSON.stringify(body),
      signal,
      redirect: 'error'
    });
  } catch (error) {
    if (error.name === 'AbortError') throw error;
    throw new ApiError('Нет связи с Albertgram. Проверь подключение и попробуй снова.');
  }

  const data = await response.json().catch(() => null);
  if (!response.ok) {
    if (response.status === 401 && auth && token && me) logout('Сессия закончилась. Войди снова.');
    throw new ApiError(data?.error || 'Ошибка сервера (' + response.status + ').', response.status);
  }
  if (data === null && response.status !== 204) throw new ApiError('Сервер вернул ответ в неожиданном формате.');
  return data;
}

function name(node, text, verified) {
  node.textContent = text;
  if (verified) {
    const badge = element('span', 'verified', '✓');
    badge.setAttribute('role', 'img');
    badge.setAttribute('aria-label', 'Подтверждённый аккаунт');
    node.append(badge);
  }
}

function avatar(node, label) {
  const letter = Array.from(label || '?')[0];
  node.textContent = letter.toUpperCase();
  node.style.setProperty('--hue', String(195 + (letter.toLowerCase().codePointAt(0) % 93)));
}

function button(text, style = 'secondary') {
  const node = element('button', style, text);
  node.type = 'button';
  return node;
}

function openDialog(title) {
  $('dialog-title').textContent = title;
  const body = $('dialog-body');
  body.replaceChildren();
  if (!$('dialog').open) $('dialog').showModal();
  return body;
}

$('close-dialog').onclick = () => $('dialog').close();
$('dialog').onclick = (event) => {
  if (event.target !== $('dialog')) return;
  const rect = $('dialog').getBoundingClientRect();
  if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) {
    $('dialog').close();
  }
};

function setMode(enabled) {
  registration = enabled;
  $('login-tab').setAttribute('aria-pressed', String(!enabled));
  $('register-tab').setAttribute('aria-pressed', String(enabled));
  $('display-name-field').hidden = !enabled;
  $('login-code-field').hidden = enabled;
  $('login-code').required = !enabled;
  $('password').minLength = enabled ? 8 : 0;
  $('password').autocomplete = enabled ? 'new-password' : 'current-password';
  $('auth-submit').textContent = enabled ? 'Создать аккаунт' : 'Войти';
  $('auth-error').textContent = '';
  toggleInvite();
}

function toggleInvite() {
  $('invite-field').hidden = !registration || cleanUsername($('username').value).toLowerCase() !== 'albert';
}

$('login-tab').onclick = () => setMode(false);
$('register-tab').onclick = () => setMode(true);
$('username').oninput = toggleInvite;

async function submitAuth(buttonId, work) {
  const submit = $(buttonId);
  if (submit.disabled) return;
  $('auth-error').textContent = '';
  submit.disabled = true;
  $('login-tab').disabled = true;
  $('register-tab').disabled = true;
  try {
    await work();
  } catch (error) {
    $('auth-error').textContent = error.message;
  } finally {
    submit.disabled = false;
    $('login-tab').disabled = false;
    $('register-tab').disabled = false;
  }
}

$('auth-form').onsubmit = (event) => {
  event.preventDefault();
  submitAuth('auth-submit', async () => {
    const username = cleanUsername($('username').value);
    if (!username) throw new Error('Введи юзернейм.');
    const password = $('password').value;
    if (!registration) {
      const result = await api('/api/login', {auth: false, body: {username, password, code: $('login-code').value}});
      await enter(result.token);
      return;
    }

    const result = await api('/api/register', {
      auth: false,
      body: {
        username,
        password,
        name: $('display-name').value,
        invite: $('invite-field').hidden ? '' : $('invite').value.trim()
      }
    });
    pendingUsername = username;
    enrollmentTicket = result.ticket || '';
    $('secret').textContent = result.secret;
    $('auth-link').hidden = !/^otpauth:\/\//i.test(result.uri || '');
    if (!$('auth-link').hidden) $('auth-link').href = result.uri;
    $('password').value = '';
    $('invite').value = '';
    $('auth-tabs').hidden = true;
    $('auth-form').hidden = true;
    $('setup').hidden = false;
    $('confirm-code').focus();
  });
};

$('setup').onsubmit = (event) => {
  event.preventDefault();
  submitAuth('confirm-submit', async () => {
    const result = await api('/api/confirm', {
      auth: false,
      body: {username: pendingUsername, code: $('confirm-code').value, ticket: enrollmentTicket}
    });
    enrollmentTicket = '';
    await enter(result.token);
  });
};

$('cancel-setup').onclick = () => {
  pendingUsername = '';
  enrollmentTicket = '';
  $('setup').reset();
  $('secret').textContent = '';
  $('copy-key').textContent = 'Скопировать ключ';
  $('auth-link').removeAttribute('href');
  $('setup').hidden = true;
  $('auth-form').hidden = false;
  $('auth-tabs').hidden = false;
  setMode(false);
  $('username').focus();
};

$('copy-key').onclick = async () => {
  try {
    await navigator.clipboard.writeText($('secret').textContent);
    $('copy-key').textContent = 'Ключ скопирован';
  } catch {
    const range = document.createRange();
    range.selectNodeContents($('secret'));
    const selection = window.getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
    $('copy-key').textContent = 'Ключ выделен';
  }
};

function logout(message) {
  localStorage.removeItem('ag');
  localStorage.removeItem('ag_server');
  if (message) sessionStorage.setItem('ag_notice', message);
  location.reload();
}

$('logout').onclick = async () => {
  $('logout').disabled = true;
  try {
    await api('/api/logout', {body: {}, signal: AbortSignal.timeout(2500)});
  } catch {
    // End the local session even if the server cannot be reached.
  } finally {
    logout();
  }
};

async function enter(value) {
  if (!value) throw new Error('Сервер не выдал токен входа.');
  token = value;
  try {
    me = await api('/api/me');
  } catch (error) {
    token = null;
    if (error.status === 401 || error.status === 403) {
      localStorage.removeItem('ag');
      localStorage.removeItem('ag_server');
    }
    throw error;
  }
  localStorage.setItem('ag_server', tokenServer);
  localStorage.setItem('ag', token);
  $('password').value = '';
  $('secret').textContent = '';
  $('auth-link').removeAttribute('href');
  $('auth').hidden = true;
  $('app').hidden = false;
  $('admin').hidden = !me.admin;
  $('profile').textContent = me.username ? '@' + me.username : (me.name || '');
  $('profile').parentElement.hidden = !$('profile').textContent;
  sync();
}

function connection(message) {
  for (const id of ['connection', 'sidebar-connection']) {
    $(id).textContent = message;
    $(id).hidden = !message;
  }
}

async function sync() {
  let needsRefresh = true;
  while (me) {
    try {
      if (needsRefresh) {
        await refresh();
        needsRefresh = false;
      }
      connection('');
      const update = await api('/api/wait?v=' + encodeURIComponent(version));
      if (update.v !== version) {
        version = update.v;
        needsRefresh = true;
      }
      await delay(1600);
    } catch {
      needsRefresh = true;
      connection('Связь прервалась. Переподключаемся…');
      await delay(2500);
    }
  }
}

async function refresh({messages = true} = {}) {
  const request = ++chatsRequest;
  const result = await api('/api/chats');
  if (request > appliedChatsRequest) {
    appliedChatsRequest = request;
    chats = result.chats;
    if (!$('search').value.trim()) drawChats();
  }
  if (currentChat && messages) await loadMessages().catch(showChatError);
}

function listStatus(text) {
  $('list').replaceChildren(element('p', 'list-status', text));
}

function chatRow(title, subtitle, verified, action) {
  const row = button('', 'chat-row');
  const icon = element('span', 'avatar');
  const details = element('span', 'details');
  const titleNode = element('strong');
  icon.setAttribute('aria-hidden', 'true');
  avatar(icon, title);
  name(titleNode, title, verified);
  details.append(titleNode, element('small', '', subtitle));
  row.append(icon, details);
  row.onclick = action;
  return row;
}

function drawChats() {
  if (!chats.length) {
    listStatus('Чатов пока нет. Найди собеседника по юзернейму.');
    return;
  }
  const fragment = document.createDocumentFragment();
  const activeRow = document.activeElement?.dataset.chatId;
  for (const chat of chats) {
    const row = chatRow(chat.title || 'Чат', chat.last || 'Нет сообщений', chat.verified, () => openChat(chat));
    row.dataset.chatId = keyFor(chat.id);
    if (currentChat && sameId(chat.id, currentChat.id)) row.setAttribute('aria-current', 'true');
    fragment.append(row);
  }
  $('list').replaceChildren(fragment);
  if (activeRow !== undefined) {
    Array.from($('list').children).find((row) => row.dataset.chatId === activeRow)?.focus({preventScroll: true});
  }
}

function openChat(chat) {
  if (!chat) throw new Error('Чат ещё не появился в списке. Попробуй открыть его снова.');
  currentChat = chat;
  messagesSnapshot = '';
  latestMessageId = null;
  $('message-content').replaceChildren(element('p', 'message-empty', 'Загружаем сообщения…'));
  $('app').classList.add('chat-open');
  $('placeholder').hidden = true;
  $('chat-header').hidden = false;
  $('messages').hidden = false;
  $('composer-area').hidden = false;
  avatar($('chat-avatar'), chat.title);
  name($('chat-title'), chat.title || 'Чат', chat.verified);
  $('chat-type').textContent = chat.type === 'group' ? 'Группа' : 'Чат';
  $('message').value = drafts.get(keyFor(chat.id)) || '';
  if (animationsEnabled && !motionPreference.matches && matchMedia('(min-width: 721px)').matches) {
    $('chat-header').getAnimations().forEach((animation) => animation.cancel());
    $('chat-header').animate([{opacity: .55}, {opacity: 1}], {duration: 200, easing: 'ease-out'});
  }
  $('chat-error').textContent = '';
  updateSendButton();
  if (!$('search').value.trim()) drawChats();
  loadMessages(true).catch(showChatError);
}

$('back').onclick = () => {
  const previous = currentChat;
  currentChat = null;
  messageRequest++;
  $('app').classList.remove('chat-open');
  $('chat-header').hidden = true;
  $('messages').hidden = true;
  $('composer-area').hidden = true;
  $('placeholder').hidden = false;
  if (!$('search').value.trim()) drawChats();
  const row = Array.from($('list').children).find((item) => previous && item.dataset.chatId === keyFor(previous.id));
  (row || $('search')).focus();
};

function showChatError(error) {
  $('chat-error').textContent = error.message;
}

async function loadMessages(first = false) {
  const chat = currentChat;
  if (!chat) return;
  const request = ++messageRequest;
  let result;
  try {
    result = await api('/api/msgs?chat=' + encodeURIComponent(chat.id));
  } catch (error) {
    if (currentChat && request === messageRequest) {
      if (!$('message-content').children.length || $('message-content').textContent === 'Загружаем сообщения…') {
        $('message-content').replaceChildren(element('p', 'message-empty', 'Не удалось загрузить сообщения.'));
      }
      throw error;
    }
    return;
  }
  if (!currentChat || request !== messageRequest) return;

  const snapshot = JSON.stringify(result.msgs);
  if (snapshot === messagesSnapshot) return;
  const wasEmpty = messagesSnapshot === "[]";
  messagesSnapshot = snapshot;
  const scroll = $('messages');
  const content = $('message-content');
  const stick = first || scroll.scrollHeight - scroll.scrollTop - scroll.clientHeight < 120;
  const anchor = stick ? null : Array.from(content.children).find((node) => node.dataset.messageId !== undefined &&
    node.getBoundingClientRect().bottom > scroll.getBoundingClientRect().top);
  const anchorOffset = anchor ? anchor.getBoundingClientRect().top : 0;
  const previousTop = scroll.scrollTop;
  const activeMessage = document.activeElement?.closest('[data-message-id]');
  const activeControl = activeMessage ? Array.from(activeMessage.querySelectorAll('button')).indexOf(document.activeElement) : -1;
  const fragment = document.createDocumentFragment();
  if (!result.msgs.length) fragment.append(element('p', 'message-empty', 'Сообщений пока нет.'));
  const previousTail = latestMessageId === null ? -1 :
    result.msgs.findIndex((message) => keyFor(message.id) === latestMessageId);
  for (const [index, message] of result.msgs.entries()) {
    const bubble = buildMessage(message, chat);
    if (stick && (wasEmpty || (previousTail >= 0 && index > previousTail)) && index >= result.msgs.length - 4) {
      bubble.classList.add('arriving');
    }
    fragment.append(bubble);
  }
  const latest = result.msgs.at(-1);
  latestMessageId = latest ? keyFor(latest.id) : null;
  content.replaceChildren(fragment);
  const newAnchor = anchor && Array.from(content.children).find((node) => node.dataset.messageId === anchor.dataset.messageId);
  if (stick) scroll.scrollTop = scroll.scrollHeight;
  else if (newAnchor) scroll.scrollTop += newAnchor.getBoundingClientRect().top - anchorOffset;
  else scroll.scrollTop = previousTop;
  if (activeControl >= 0) {
    Array.from(content.children).find((node) => node.dataset.messageId === activeMessage.dataset.messageId)
      ?.querySelectorAll('button')[activeControl]?.focus({preventScroll: true});
  }
}

function buildMessage(message, chat) {
  const mine = sameId(message.from.id, me.id);
  const bubble = element('article', 'bubble' + (mine ? ' mine' : ''));
  bubble.dataset.messageId = keyFor(message.id);
  if (!mine && chat.type === 'group') {
    const author = element('strong', 'author');
    name(author, message.from.name, message.from.verified);
    bubble.append(author);
  }
  bubble.append(element('p', '', message.text || ''));

  const meta = element('div', 'message-meta');
  const date = new Date(message.ts * 1000);
  if (Number.isFinite(date.getTime())) {
    const time = element('time', '', timeFormat.format(date) + (message.edited ? ' · изм.' : ''));
    time.dateTime = date.toISOString();
    meta.append(time);
  }
  if (mine) {
    const menu = button('⋯', 'message-menu');
    menu.setAttribute('aria-label', 'Действия с сообщением');
    menu.onclick = () => messageMenu(message, chat.id);
    meta.append(menu);
  }
  bubble.append(meta);

  if (message.markup?.inline_keyboard?.length) {
    const keyboard = element('div', 'keyboard');
    for (const entries of message.markup.inline_keyboard) {
      const row = element('div', 'keyboard-row');
      for (const entry of entries) {
        const action = button(entry.text);
        action.onclick = async () => {
          try {
            if (entry.url) {
              const url = new URL(entry.url);
              if (!['https:', 'http:', 'tg:'].includes(url.protocol)) throw new Error('Этот тип ссылки не поддерживается.');
              window.open(url.href, '_blank', 'noopener,noreferrer');
            } else {
              action.disabled = true;
              await api('/api/cb', {body: {msg: message.id, data: entry.callback_data}});
            }
          } catch (error) {
            if (currentChat && sameId(currentChat.id, chat.id)) showChatError(error);
          } finally {
            action.disabled = false;
          }
        };
        row.append(action);
      }
      keyboard.append(row);
    }
    bubble.append(keyboard);
  }
  return bubble;
}

function updateSendButton() {
  $('send').disabled = !currentChat || sending.has(keyFor(currentChat.id));
}

$('message').oninput = () => {
  if (currentChat) drafts.set(keyFor(currentChat.id), $('message').value);
};

$('message').onkeydown = (event) => {
  if (event.key === 'Enter' && !event.shiftKey && !event.isComposing && event.keyCode !== 229) {
    event.preventDefault();
    if (!$('send').disabled) $('composer').requestSubmit();
  }
};

$('composer').onsubmit = async (event) => {
  event.preventDefault();
  if (!currentChat) return;
  const {id} = currentChat;
  const key = keyFor(id);
  const draft = $('message').value;
  if (!draft.trim() || sending.has(key)) return;

  $('chat-error').textContent = '';
  sending.add(key);
  updateSendButton();
  try {
    await api('/api/send', {body: {chat: id, text: draft.trim()}});
    if (drafts.get(key) === draft) drafts.delete(key);
    if (currentChat && sameId(currentChat.id, id) && $('message').value === draft) $('message').value = '';
  } catch (error) {
    if (currentChat && sameId(currentChat.id, id)) showChatError(error);
    return;
  } finally {
    sending.delete(key);
    updateSendButton();
  }
  if (currentChat && sameId(currentChat.id, id)) {
    loadMessages(true).catch((error) => {
      if (currentChat && sameId(currentChat.id, id)) showChatError(error);
    });
  }
  refresh({messages: false}).catch(() => connection('Не удалось обновить список чатов.'));
};

function fields(body, entries, submitText, action) {
  const form = element('form', 'stack');
  const values = {};
  for (const [key, caption, options] of entries) {
    const label = element('label', '', caption);
    const input = element(options.multiline ? 'textarea' : 'input');
    input.value = options.value || '';
    input.required = Boolean(options.required);
    if (options.placeholder) input.placeholder = options.placeholder;
    if (options.multiline) input.rows = 4;
    label.append(input);
    form.append(label);
    values[key] = input;
  }
  const error = element('p', 'error');
  error.setAttribute('role', 'alert');
  const submit = button(submitText, 'primary');
  submit.type = 'submit';
  form.append(error, submit);
  form.onsubmit = async (event) => {
    event.preventDefault();
    if (submit.disabled) return;
    error.textContent = '';
    submit.disabled = true;
    try {
      await action(values);
    } catch (failure) {
      error.textContent = failure.message;
    } finally {
      submit.disabled = false;
    }
  };
  body.append(form);
  Object.values(values)[0]?.focus();
}

function messageMenu(message, chatId) {
  const body = openDialog('Действия с сообщением');
  const edit = button('Изменить');
  const remove = button('Удалить', 'secondary danger');
  const finish = () => {
    $('dialog').close();
    if (currentChat && sameId(currentChat.id, chatId)) loadMessages().catch(showChatError);
    refresh({messages: false}).catch(() => connection('Не удалось обновить список чатов.'));
  };
  edit.onclick = () => {
    fields(openDialog('Изменить сообщение'), [
      ['text', 'Сообщение', {value: message.text, multiline: true, required: true}]
    ], 'Сохранить', async ({text}) => {
      if (!text.value.trim()) throw new Error('Введи текст сообщения.');
      await api('/api/edit', {body: {id: message.id, text: text.value.trim()}});
      finish();
    });
  };
  remove.onclick = () => {
    const confirmation = openDialog('Удалить сообщение?');
    fields(confirmation, [], 'Удалить', async () => {
      await api('/api/delete', {body: {id: message.id}});
      finish();
    });
  };
  body.append(edit, remove);
  edit.focus();
}

function cancelSearch() {
  clearTimeout(searchTimer);
  searchController?.abort();
  searchController = null;
  return ++searchRequest;
}

$('search').oninput = () => {
  const request = cancelSearch();
  const query = $('search').value.trim();
  if (!query) {
    drawChats();
    return;
  }
  listStatus('Ищем…');
  searchTimer = setTimeout(() => searchUsers(query, request), 300);
};

async function searchUsers(query, request) {
  const controller = new AbortController();
  searchController = controller;
  try {
    const result = await api('/api/search?q=' + encodeURIComponent(query), {signal: controller.signal});
    if (request !== searchRequest) return;
    if (!result.users.length) {
      listStatus('Никого не нашли.');
      return;
    }
    const fragment = document.createDocumentFragment();
    for (const user of result.users) {
      const row = chatRow(user.name || user.username, '@' + user.username + (user.bot ? ' · бот' : ''), user.verified, async () => {
        row.disabled = true;
        try {
          const result = await api('/api/chat/open', {body: {username: user.username}});
          await refresh({messages: false});
          if (request !== searchRequest) return;
          const chat = findChat(result.chat);
          if (!chat) throw new Error('Чат ещё не появился в списке. Попробуй открыть его снова.');
          cancelSearch();
          $('search').value = '';
          openChat(chat);
        } catch (error) {
          if (request !== searchRequest) return;
          $('list').querySelector('.error')?.remove();
          const status = element('p', 'list-status error', error.message);
          status.setAttribute('role', 'alert');
          $('list').prepend(status);
        } finally {
          row.disabled = false;
        }
      });
      fragment.append(row);
    }
    $('list').replaceChildren(fragment);
  } catch (error) {
    if (request === searchRequest && error.name !== 'AbortError') listStatus(error.message);
  }
}

$('group').onclick = () => {
  fields(openDialog('Новая группа'), [
    ['title', 'Название группы', {required: true}],
    ['members', 'Юзернеймы через запятую', {placeholder: '@albert, @Papochka'}]
  ], 'Создать группу', async ({title, members}) => {

    if (!groupTitle) throw new Error('Введи название группы.');
    const usernames = members.value.split(',').map((item) => item.trim()).filter(Boolean);
    const result = await api('/api/group', {body: {title: groupTitle, members: usernames}});
    $('dialog').close();
    cancelSearch();
    $('search').value = '';
    try {
      await refresh({messages: false});
      openChat(findChat(result.chat));
    } catch {
      listStatus('Группа создана. Обновляем список чатов…');
    }
  });
};

$('admin').onclick = async () => {
  const body = openDialog('Админ-меню');
  const stats = element('p', 'muted', 'Загружаем данные…');
  const error = element('p', 'error');
  error.setAttribute('role', 'alert');
  const users = element('div');
  body.append(stats, error, users);

  async function drawUsers() {
    const result = await api('/api/admin/users');
    const fragment = document.createDocumentFragment();
    for (const user of result.users) {
      const row = element('div', 'admin-row');
      const label = element('span');
      name(label, (user.name ? user.name + ' ' : '') + '@' + user.username + (user.bot ? ' · бот' : '') +
        (user.banned ? ' · заблокирован' : ''), user.verified);
      row.append(label);
      for (const [field, caption] of [
        ['verified', user.verified ? 'Снять ✓' : 'Дать ✓'],
        ['banned', user.banned ? 'Разблокировать' : 'Заблокировать']
      ]) {
        const control = button(caption);
        control.onclick = async () => {
          error.textContent = '';
          const controls = Array.from(users.querySelectorAll('button'));
          controls.forEach((item) => { item.disabled = true; });
          try {

          } catch (failure) {
            error.textContent = failure.message;
            controls.forEach((item) => { item.disabled = false; });
          }
        };
        row.append(control);
      }
      fragment.append(row);
    }
    users.replaceChildren(fragment);
  }

  try {
    const result = await api('/api/admin/stats');
    stats.textContent = `Люди ${result.users} · Боты ${result.bots} · Чаты ${result.chats} · Сообщения ${result.msgs}`;

    stats.textContent = '';
    error.textContent = failure.message;

function setTheme(theme) {
  document.documentElement.dataset.theme = theme;
}

function showSettings() {
  const body = openDialog('Настройки');
  const label = element('h3', '', 'Оформление');
  label.id = 'theme-label';
  label.style.margin = '0';
  const options = element('div', 'theme-options');
  options.setAttribute('role', 'group');
  options.setAttribute('aria-labelledby', label.id);
  const choices = [];
  for (const [id, title] of Object.entries(THEMES)) {
    const choice = button(title, 'theme-option');
    choice.dataset.theme = id;
    choice.setAttribute('aria-pressed', String(document.documentElement.dataset.theme === id));
    const preview = element('span', 'theme-swatch');
    preview.dataset.preview = id;
    preview.setAttribute('aria-hidden', 'true');
    choice.prepend(preview);
    choice.onclick = () => {
      setTheme(id);
      localStorage.setItem('ag_theme', id);
      for (const item of choices) item.setAttribute('aria-pressed', String(item === choice));
    };
    choices.push(choice);
    options.append(choice);
  }
  const motion = button('Плавные анимации', 'motion-switch');
  motion.setAttribute('role', 'switch');
  motion.setAttribute('aria-checked', String(animationsEnabled));
  const track = element('span', 'switch-track');
  track.setAttribute('aria-hidden', 'true');
  motion.append(track);
  motion.onclick = () => {
    setMotion(!animationsEnabled);
    localStorage.setItem('ag_motion', animationsEnabled ? 'on' : 'off');
    motion.setAttribute('aria-checked', String(animationsEnabled));
  };
  body.append(label, options, motion);
  if (me) {
    const newBot = button('Создать бота');
    newBot.onclick = showBotForm;
    body.append(newBot);
  }
  const active = choices.find((item) => item.getAttribute('aria-pressed') === 'true');
  active?.focus();
}

$('settings-login').onclick = showSettings;
$('settings').onclick = showSettings;

function setMotion(enabled) {
  animationsEnabled = enabled;
  document.documentElement.dataset.motion = enabled ? 'on' : 'off';
  if (!enabled) $('chat-header').getAnimations?.().forEach((animation) => animation.cancel());
}

function showBotForm() {
  fields(openDialog('Новый бот'), [
    ['name', 'Имя бота', {required: true}],
    ['username', 'Юзернейм бота', {required: true, placeholder: '@my_bot'}]
  ], 'Создать', async ({name, username}) => {
    const result = await api('/api/bots/create', {body: {
      name: name.value.trim(),
      username: cleanUsername(username.value)
    }});
    const body = openDialog('Бот @' + result.username);
    const token = element('code', 'bot-token', result.token);
    const copy = button('Скопировать токен');
    copy.onclick = async () => {
      try {
        await navigator.clipboard.writeText(result.token);
        copy.textContent = 'Токен скопирован';
      } catch {
        const range = document.createRange();
        range.selectNodeContents(token);
        window.getSelection().removeAllRanges();
        window.getSelection().addRange(range);
        copy.textContent = 'Токен выделен';
      }
    };
    body.append(element('p', 'muted', 'Сохрани токен сейчас. Он даёт доступ к Bot API и показывается один раз.'), token, copy);
    copy.focus();
  });
}

const notice = sessionStorage.getItem('ag_notice');
if (notice) {
  sessionStorage.removeItem('ag_notice');
  $('auth-error').textContent = notice;
}
if (token) submitAuth('auth-submit', () => enter(token));
</script>
</body>
</html>
